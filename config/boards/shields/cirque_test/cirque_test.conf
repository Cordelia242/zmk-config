CONFIG_ZMK_KEYBOARD_NAME="Cirque Test"

# Enable mouse support
CONFIG_ZMK_MOUSE=y
CONFIG_INPUT=y
CONFIG_GPIO=y

# Enable I2C
CONFIG_I2C=y
CONFIG_PINCTRL=y
CONFIG_INPUT_PINNACLE=y

# Enable USB Logging
CONFIG_ZMK_USB_LOGGING=y

# Enable detailed logging for trackpad
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y
CONFIG_INPUT_LOG_LEVEL_DBG=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y
CONFIG_I2C_LOG_LEVEL_DBG=y
CONFIG_PINNACLE_LOG_LEVEL_DBG=y

# Add delay to catch early boot issues
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Disable BLE to save resources during testing
CONFIG_BT=n
CONFIG_ZMK_BLE=n

# Enable USB HID for mouse
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_HID=y
